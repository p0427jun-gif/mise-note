<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ドライフラワー店ノート</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="店ノート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<script src="firebase-config.js"></script>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 方針（v2）: 明るいグレーの地に白いカード。文字はほぼ黒（白地で17:1）。
     押せるものは「バラ色の枠か塗り」、入力欄は「濃いグレーの枠」（どちらも白地で4.5:1以上）。
     文字はユニバーサルデザインフォント（BIZ UDPゴシック）。色だけに頼らず ✓ や文字でも区別する */
  --paper:#EDEFF2; --surface:#FFFFFF; --ink:#16181D; --muted:#474C55; --line:#C3C8CF; --ctl:#6B727C;
  --accent:#A02550; --accent-ink:#FFFFFF; --accent-soft:#FCEBF1;
  --good:#1B6B3C; --warn:#8A4A00; --bad:#B42318;
  --shadow:0 1px 3px rgba(16,24,40,.10),0 1px 2px rgba(16,24,40,.06);
  --display:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,system-ui,sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:18px/1.75 var(--body);-webkit-text-size-adjust:100%;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.app{max-width:640px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 10px}
.top h1{font:700 22px/1.3 var(--display);letter-spacing:.02em}
.top .date{font-size:16px;color:var(--muted)}
.iconbtn{min-width:62px;height:62px;padding:4px 8px;border-radius:14px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer;flex:none;font-size:16px;font-weight:700;line-height:1.2;color:var(--ink)}
.iconbtn span{display:block;white-space:nowrap}
.iconbtn svg{width:24px;height:24px;stroke:var(--ink)}
.banner{border-radius:12px;padding:12px 14px;margin:4px 0 12px;font-size:16px;background:var(--accent-soft);border:1px solid var(--line)}
.banner:empty{display:none}
.panebody{display:flex;flex-direction:column;gap:18px}
body[data-split="lr"] .app{max-width:1400px}
body[data-split="tb"] .app{max-width:900px}
body[data-split="lr"] .app,body[data-split="tb"] .app{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
body[data-split="lr"] #panes,body[data-split="tb"] #panes{display:grid;gap:10px;min-height:0}
body[data-split="lr"] #panes{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
body[data-split="tb"] #panes{grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
body[data-split="lr"] .pane,body[data-split="tb"] .pane{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border:1px solid var(--line);border-radius:16px;padding:0 12px 12px;background:var(--paper);min-height:0}
.panehead{position:sticky;top:0;z-index:6;background:var(--paper);display:flex;align-items:center;gap:8px;padding:10px 0;margin-bottom:4px;border-bottom:1px solid var(--line)}
.panehead label{font-size:16px;color:var(--muted);white-space:nowrap}
.panehead select{min-height:44px;padding:6px 10px;font-weight:700}
body[data-split="lr"] .composer,body[data-split="tb"] .composer{bottom:-12px}
.splitopt{justify-content:flex-start;gap:14px}
.splitopt svg{width:40px;height:28px;flex:none}
.splitopt[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.section-title h2{font:700 19px/1.4 var(--display)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card > h2,.card > .section-title{margin-bottom:6px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.hero .label{font-size:16px;color:var(--muted)}
.hero .big{font:700 40px/1.2 var(--body);font-variant-numeric:tabular-nums}
.hero .sub{font-size:16px;color:var(--muted)}
.btn{min-height:54px;padding:8px 18px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.3;text-decoration:none;color:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.wide{width:100%}
.btn.big{min-height:64px;font-size:19px}
.btn.small{min-height:48px;padding:6px 14px;font-size:17px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:22px;height:22px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick .btn{min-height:64px;flex-direction:column;gap:2px;font-size:16px}
.quick small{font-weight:500;color:var(--muted)}
.quick .primary small{color:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 140px}
.list{display:flex;flex-direction:column;gap:10px}
.notice{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:12px 14px}
.notice.warn{border-left-color:var(--warn)} .notice.accent{border-left-color:var(--accent)} .notice.good{border-left-color:var(--good)}
.notice .t{font-weight:700} .notice .d{font-size:16px;color:var(--muted)}
.chip{display:inline-block;font-size:16px;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;line-height:1.6}
.chip.good{color:var(--good)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)} .chip.muted{color:var(--muted)} .chip.accent{color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:50px;padding:0 16px;font-weight:700;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.pcard{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.thumb{width:76px;height:76px;border-radius:10px;object-fit:cover;background:var(--accent-soft);display:grid;place-items:center}
.thumb svg{width:34px;height:34px;stroke:var(--accent)}
.pcard .name{font-weight:700;line-height:1.4;background:none;border:0;padding:0;text-align:left;cursor:pointer;font-size:17px}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:16px;color:var(--muted);margin-top:2px}
.stepper{display:flex;align-items:center;gap:6px;margin-top:8px}
.stepper button{width:52px;height:52px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:22px;font-weight:700;cursor:pointer;line-height:1}
.stepper .v{min-width:56px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile .l{font-size:16px;color:var(--muted)}
.tile .v{font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.3}
.tile .v.neg{color:var(--bad)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav strong{font:700 18px/1.3 var(--display)}
.chart{width:100%;height:auto;display:block}
.chart .bar{fill:var(--accent);opacity:.28}
.chart .pbar{fill:var(--accent)}
.chart text{fill:var(--muted);font-size:13px;font-family:var(--body)}
.chart .val{fill:var(--ink);font-weight:700}
.chart .base{stroke:var(--line)}
.legend{display:flex;gap:14px;font-size:16px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--accent);vertical-align:-1px;margin-right:4px}
.legend i.l{opacity:.28}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .s1{font-weight:700;line-height:1.4}
.srow .s2{font-size:16px;color:var(--muted)}
.del{min-width:58px;height:46px;border-radius:12px;border:2px solid var(--line);background:transparent;cursor:pointer;color:var(--ink);font-size:16px;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl th{font-size:16px;color:var(--muted);font-weight:500;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td:not(:first-child),.tbl th:not(:first-child){white-space:nowrap}
.tbl td:first-child{min-width:7em}
.scroll{overflow-x:auto}
.share{height:10px;border-radius:5px;background:var(--accent-soft);overflow:hidden;margin-top:4px}
.share b{display:block;height:100%;background:var(--accent)}
.empty{color:var(--muted);font-size:16px;padding:6px 0}
.season{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.season:first-child{border-top:0}
.season .h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.season .dates{font-size:16px;color:var(--muted)}
.evcard{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left;width:100%}
.evdate{display:grid;place-items:center;background:var(--accent-soft);border-radius:10px;height:64px;line-height:1.1}
.evdate b{font:700 24px var(--display)} .evdate span{font-size:16px;color:var(--muted)}
.evcard .t{font-weight:700;line-height:1.4}
.check-item{display:flex;align-items:center;gap:12px;min-height:48px;border-top:1px solid var(--line);padding:4px 0}
.check-item:first-child{border-top:0}
.check-item input{width:24px;height:24px;flex:none}
.check-item input[type=checkbox]{-webkit-appearance:none;appearance:none;width:32px;height:32px;margin:0;border:2.5px solid var(--accent);border-radius:50%;background:var(--card,#fff);display:grid;place-content:center;cursor:pointer;transition:background .15s}
.check-item input[type=checkbox]::before{content:"";width:9px;height:16px;border:solid #fff;border-width:0 3.5px 3.5px 0;transform:translateY(-2px) rotate(45deg) scale(0);transition:transform .15s}
.check-item input[type=checkbox]:checked{background:var(--accent)}
.check-item input[type=checkbox]:checked::before{transform:translateY(-2px) rotate(45deg) scale(1)}
.check-item input[type=checkbox]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.srow2{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.srow2 .n{font-weight:700;font-size:18px;line-height:1.4}
.bigstep{display:flex;align-items:center;gap:6px;flex:none}
.bigstep button{width:58px;height:58px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:28px;font-weight:700;cursor:pointer;line-height:1;color:var(--ink)}
.bigstep button.v{width:78px;font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--paper)}
.bigstep button.v small{font-size:14px;font-weight:500;color:var(--muted)}
.regi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.regibtn{min-height:128px;border-radius:16px;border:2px solid var(--accent);background:var(--surface);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:2px;padding:12px;text-align:left;cursor:pointer;color:var(--ink)}
.regibtn:active{background:var(--accent);color:var(--accent-ink)}
.regibtn .n{font-weight:700;font-size:18px;line-height:1.35}
.regibtn .p{font-size:20px;font-weight:700;color:var(--accent)}
.regibtn .l{font-size:16px;color:var(--muted)}
.regibtn .t{font-size:16px;font-weight:700;color:var(--accent)}
.regibtn.out{border:2px dashed var(--ctl);background:#F4F5F7;box-shadow:none}
.regibtn.out .p{color:var(--muted)}
.hbar{display:grid;grid-template-columns:44px 1fr 48px;align-items:center;gap:8px}
.hbar b{display:block;height:16px;border-radius:8px;background:var(--accent);min-width:4px}
.pstrip{display:flex;flex-direction:column;gap:8px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pgrid:empty{display:none}
.pthumb{padding:0;border:2px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:1;background:var(--accent-soft);cursor:pointer}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;background:var(--card,#fff)}
.pick input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.check-item.done span{text-decoration:line-through;color:var(--muted)}
.check-item .x{margin-left:auto}
.sell{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.sell:first-child{border-top:0}
.sell .n{font-weight:700;line-height:1.4}
.sell .btn{min-height:56px;min-width:108px}
.chat{display:flex;flex-direction:column;gap:10px}
.bubble{max-width:92%;padding:12px 14px;border-radius:16px;line-height:1.75;word-break:break-word}
.bubble.user{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
.bubble.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble .err{color:var(--bad);font-size:16px}
.bubble .tools{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.presets button{min-height:44px;padding:6px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px;cursor:pointer;text-align:left;line-height:1.4}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--paper);padding:8px 0 4px;display:grid;gap:8px}
.composer .bar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:end}
.composer textarea{min-height:52px;max-height:160px;resize:vertical}
.talk{min-height:72px;font-size:18px;border-radius:18px}
.talk.on{background:var(--bad);border-color:var(--bad);color:#fff}
.live{font-size:16px;color:var(--muted);min-height:1.5em}
.mic.on{background:var(--accent);border-color:var(--accent)}
.mic.on svg{stroke:var(--accent-ink)} .mic.on{color:var(--accent-ink)}
.attach{font-size:16px;color:var(--muted);display:flex;align-items:center;gap:8px}
.note{font-size:16px;color:var(--muted);line-height:1.7}
.prose{line-height:1.8}
.prose p{margin:0 0 8px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;text-decoration:none;color:var(--muted);font-size:16px;font-weight:700;min-height:70px;justify-content:center;letter-spacing:-.04em;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--accent-soft)}
.tabs a svg{width:26px;height:26px;stroke:currentColor}
.tabs a[aria-current="page"]{color:var(--accent)}
label.f{display:grid;gap:6px;font-size:17px;color:var(--ink);font-weight:700}
label.f > span.hint{font-size:16px;font-weight:500;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],input[type=search],select,textarea{width:100%;min-height:54px;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 14px;font-size:18px;color:var(--ink)}
textarea{min-height:96px;line-height:1.6}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:grid;gap:4px;font-size:16px}
.calc .line{display:flex;justify-content:space-between;gap:10px}
.calc .line b{font-variant-numeric:tabular-nums;white-space:nowrap}
.calc .rec{font-size:18px}
.photo-pick{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.photo-pick .thumb{width:96px;height:96px}
.check{display:flex;gap:10px;align-items:center;font-size:16px;min-height:44px}
.check input{width:22px;height:22px}
.aiblock{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px}
.aiblock:first-child{border-top:0;padding-top:0}
.aiblock .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.aiblock .h b{font-size:16px;color:var(--muted)}
.aiblock .txt{white-space:pre-wrap;line-height:1.75}
.copy{min-height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;font-size:16px;cursor:pointer}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,12,15,.45)}
.panel{background:var(--paper);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:0 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.panel .head{position:sticky;top:0;background:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:16px 0 8px;z-index:2;gap:10px}
.panel .head h2{font:700 20px/1.3 var(--display)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:16px;z-index:80;max-width:90%;text-align:center}
.toast:empty{display:none}
.thinking{color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--accent);font-weight:700;font-size:16px;cursor:pointer;padding:8px 0;min-height:44px}
details summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.report h3{font:700 17px/1.5 var(--display);margin:14px 0 4px}
.report a{color:var(--accent)}
.stgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stitem{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.stitem img{width:100%;display:block;background:#000}
.stitem .no{position:absolute;top:6px;left:6px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;padding:0 6px}
.stitem .vid{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;font-size:16px;border-radius:6px;padding:1px 6px}
.stitem .ops{display:grid;grid-template-columns:30px 1fr 30px}
.stitem .ops button{min-height:40px;border:0;border-top:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:700;cursor:pointer;color:var(--ink);white-space:nowrap;padding:0}

function priceCalc(material, minutes, packing, st = S()) {
  const labor = num(st.wage) * num(minutes) / 60;
  const cost = num(material) + labor + num(packing);
  const rate = num(st.feeRate) / 100, fixed = num(st.feeFixed), m = num(st.margin) / 100;
  const breakeven = (cost + fixed) / (1 - rate);
  const denom = 1 - rate - m;
  const raw = denom > 0.05 ? (cost + fixed) / denom : breakeven * 2;
  return { labor, cost, breakeven, raw, suggested: Math.ceil(raw / 100) * 100 };
}
const feeAt = (price, st = S()) => price * num(st.feeRate) / 100 + num(st.feeFixed);
const profitAt = (price, cost, st = S()) => price - cost - feeAt(price, st);
const productCost = p => priceCalc(p.material, p.minutes, p.packing).cost;

function matchProduct(name) {
  const n = normName(name); if (!n) return null;
  return state.products.find(p => normName(p.name) === n) || state.products.find(p => { const pn = normName(p.name); return pn && (n.includes(pn) || pn.includes(n)); }) || null;
}
const saleProduct = s => (s.productId && state.products.find(p => p.id === s.productId)) || matchProduct(s.name);
const saleTotal = s => num(s.price) * (num(s.qty) || 1) - num(s.discount);
const saleFee = (s, st = S()) => s.eventId && isConsign(state.events.find(x => x.id === s.eventId)) ? saleTotal(s) * num(state.events.find(x => x.id === s.eventId).rate) / 100 : s.channel === "BASE" ? saleTotal(s) * num(st.feeRate) / 100 + num(st.feeFixed) : 0;
const saleCost = s => { const p = saleProduct(s); return p ? productCost(p) * (num(s.qty) || 1) : null; };
const channelOf = s => s.channel === "委託" ? "委託" : s.eventId || s.channel === "イベント" || s.channel === "マルシェ" ? "イベント・マルシェ" : s.channel === "BASE" ? "BASE" : "その他";
const eventCosts = e => num(e.fee) + num(e.transport) + num(e.otherCost);
const monthSales = key => state.sales.filter(s => monthKey(s.date) === key);
function summarize(list) {
  let total = 0, fee = 0, items = 0, cost = 0, unknown = 0;
  for (const s of list) { const t = saleTotal(s); total += t; fee += saleFee(s); items += num(s.qty) || 1; const c = saleCost(s); if (c == null) unknown += t; else cost += c; }
  return { total, fee, cost, unknown, items, count: list.length, gross: total - cost, net: total - fee };
}

  for (const s of list) { const k = s.name || "（名前なし）"; const r = m.get(k) || { name: k, qty: 0, total: 0 }; r.qty += num(s.qty) || 1; r.total += saleTotal(s); m.set(k, r); }
  return [...m.values()].sort((a, b) => b.total - a.total);
}

/* カレンダー用のファイル（.ics） */
const icsEsc = s => String(s || "").replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\n").replace(/[,;]/g, m => "\\" + m);
function icsFold(line) {
  const enc = new TextEncoder(); const out = []; let cur = "", bytes = 0;
  for (const ch of line) { const b = enc.encode(ch).length; if (bytes + b > 73) { out.push(cur); cur = " " + ch; bytes = 1 + b; } else { cur += ch; bytes += b; } }
  out.push(cur); return out.join("\r\n");
}
function alarmTrigger(daysBefore, time) {
  const [hh, mm] = String(time || "08:00").split(":").map(Number);
  let mins = -daysBefore * 1440 + (hh || 0) * 60 + (mm || 0); const sign = mins < 0 ? "-" : ""; mins = Math.abs(mins);
  const d = Math.floor(mins / 1440), h = Math.floor(mins % 1440 / 60), m = mins % 60;
  let s = "P"; if (d) s += d + "D"; if (h || m) { s += "T"; if (h) s += h + "H"; if (m) s += m + "M"; } if (s === "P") s = "PT0M";

}
const icsDate = s => String(s).replace(/-/g, "");

  const s = parseYmd(r.start), wdc = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"][s.getDay()], day = s.getDate(), nth = Math.ceil(day / 7);
  const until = r.until ? `;UNTIL=${icsDate(r.until)}` : "";
  return { w1: `FREQ=WEEKLY`, w2: `FREQ=WEEKLY;INTERVAL=2`, md: `FREQ=MONTHLY;BYMONTHDAY=${day >= 29 ? -1 : day}`, mn: `FREQ=MONTHLY;BYDAY=${nth >= 5 ? -1 : nth}${wdc}`, m3: `FREQ=MONTHLY;INTERVAL=3;BYMONTHDAY=${day >= 29 ? -1 : day}`, y1: `FREQ=YEARLY` }[r.freq] + until;
}
function vevent({ uid, date, end, title, desc, place, rrule, days }) {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const L = ["BEGIN:VEVENT", `UID:${uid}@dfn-shop`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${icsDate(date)}`, `DTEND;VALUE=DATE:${icsDate(ymd(addD(parseYmd(end && end > date ? end : date), 1)))}`, `SUMMARY:${icsEsc(title)}`];
  if (rrule) L.push(`RRULE:${rrule}`);

  for (const d of [...new Set(days || [])].sort((a, b) => b - a)) L.push("BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsEsc(title)}`, `TRIGGER:${alarmTrigger(d, S().notifyTime)}`, "END:VALARM");
  L.push("END:VEVENT");

}

  const auto = [];

    cats["出展料・会場費"] += fee; cats["旅費交通費"] += tr; cats["雑費"] += ot;

  const expense = Object.values(cats).reduce((a, b) => a + b, 0);
  const months = Array.from({ length: 12 }, (_, i) => { const k = `${y}-${String(i + 1).padStart(2, "0")}`; return { k, rev: sales.filter(s => s.date.startsWith(k)).reduce((a, s) => a + saleTotal(s), 0), exp: state.expenses.filter(x => String(x.date).startsWith(k)).reduce((a, x) => a + num(x.amount), 0) }; });
  return { y, revenue, cats, expense, income: revenue - expense, auto, months, n: sales.length };
}

/* ---------- 声や文字でまとめて記録（AIが振り分け） ---------- */
function bulkSheet() {
  openSheet("まとめて記録", `<p style="margin:0">話すか書くだけで、AIが「材料の在庫」「経費」「出店の経費」「やること」「売上」などに振り分けます。登録の前に確かめられます。</p>

    <textarea id="bulk-in" style="min-height:140px" placeholder="ここに話した言葉が入ります"></textarea>
    <div class="row">${micBtn("bulk-in", "声で入れる")}<button class="btn primary" data-act="bulkRun" style="flex:1 1 160px">AIに振り分けてもらう</button></div>

async function bulkRun(btn) {

  try {
    const r = await sample.json(`ドライフラワーのお店のオーナーが話した内容を、アプリへの登録に振り分けてください。今日は${todayStr()}（${jpDateD(today())}）です。「来週」「金曜まで」などは日付になおしてください。
登録の種類:
- material: 材料の在庫に足す {"type":"material","name":"花材・資材の名前","qty":数,"unit":"本・束・個・袋・m・枚"}
- expense: 経費 {"type":"expense","date":"YYYY-MM-DD","amount":円,"category":"${EXP_CATS.join("・")} のどれか","vendor":"お店","memo":""}

材料を仕入れて金額も言っていたら、material と expense（仕入（花材・資材））の両方にしてください。駐車場代などで出店が特定できたら event_cost に、できなければ expense にしてください。話していないことは入れないでください。
登録されている材料: ${state.materials.map(m => m.name + "（" + (m.unit || "") + "）").join("、") || "なし"}
登録されている商品: ${state.products.map(p => p.name).join("、") || "なし"}
出店（id｜日付｜名前）:
${evs}

話した内容: 「${text}」

    const acts = (r && Array.isArray(r.actions) ? r.actions : []).filter(a => a && a.type);
    state.bulkActs = acts;
    $("#bulk-out").innerHTML = acts.length ? `<div class="f">登録する内容（いらないものはチェックを外す）
      ${acts.map((a, i) => `<label class="check-item"><input type="checkbox" data-bulk="${i}" checked><span>${esc(bulkLabel(a))}</span></label>`).join("")}</div>

function bulkLabel(a) {
  const ev = a.eventId && state.events.find(e => e.id === a.eventId);
  const F = { fee: "出展料", transport: "交通費", otherCost: "その他の経費" };
  return a.type === "material" ? `材料の在庫：${a.name} を＋${num(a.qty)}${a.unit || ""}`
    : a.type === "expense" ? `経費：${a.date ? jpDate(a.date) : "今日"} ${yen(a.amount)}（${a.category || "雑費"}${a.vendor ? "・" + a.vendor : ""}）`
    : a.type === "event_cost" ? `出店の経費：${ev ? jpDate(ev.date) + " " + ev.title : "（出店が見つかりません）"} の${F[a.field] || "その他の経費"}に＋${yen(a.amount)}`
    : a.type === "todo" ? `やること：${a.title}${a.due ? "（" + jpDate(a.due) + "まで）" : ""}`
    : a.type === "sale" ? `売上：${a.name} ×${num(a.qty) || 1}　${yen(num(a.price) * (num(a.qty) || 1))}（${a.channel || "その他"}）`
    : a.type === "product_stock" ? `作品の在庫：${a.name} を${num(a.delta) >= 0 ? "＋" : ""}${num(a.delta)}`
    : a.type === "drying" ? `乾燥を始める：${a.name} ${num(a.qty) || ""}${a.unit || ""}（${num(a.days) || 14}日）` : JSON.stringify(a);
}
async function bulkApply(btn) {
  btn.disabled = true; let n = 0;
  for (const [i, a] of (state.bulkActs || []).entries()) {
    const c = document.querySelector(`[data-bulk="${i}"]`); if (!c || !c.checked) continue;
    try {
      if (a.type === "material" && a.name) await addToMaterialStock(a.name, num(a.qty) || 1, a.unit || "本", "花材");
      else if (a.type === "expense" && num(a.amount)) await store.add("expenses", { date: /^\d{4}-\d{2}-\d{2}$/.test(a.date || "") ? a.date : todayStr(), amount: num(a.amount), category: EXP_CATS.includes(a.category) ? a.category : "雑費", vendor: a.vendor || "", memo: a.memo || "", pay: "現金", items: [], source: "voice", createdAt: Date.now() });
      else if (a.type === "event_cost") { const e = state.events.find(x => x.id === a.eventId); const f = ["fee", "transport", "otherCost"].includes(a.field) ? a.field : "otherCost"; if (e) await store.update("events", e.id, { [f]: num(e[f]) + num(a.amount), memo: [e.memo, a.memo].filter(Boolean).join("\n"), updatedAt: Date.now() }); else continue; }
      else if (a.type === "todo" && a.title) await store.add("todos", { title: a.title, due: /^\d{4}-\d{2}-\d{2}$/.test(a.due || "") ? a.due : "", cat: "", done: false, createdAt: Date.now() });
      else if (a.type === "sale" && a.name) { const p = matchProduct(a.name); const q = num(a.qty) || 1; await store.add("sales", { date: todayStr(), productId: p ? p.id : "", name: p ? p.name : a.name, qty: q, price: num(a.price) || (p ? num(p.price) : 0), channel: CHANNELS.includes(a.channel) ? a.channel : "その他", createdAt: Date.now() }); if (p) await addStock(p.id, -q); }
      else if (a.type === "product_stock") { const p = matchProduct(a.name); if (p) await addStock(p.id, num(a.delta)); else continue; }
      else if (a.type === "drying" && a.name) await store.add("drying", { name: a.name, qty: num(a.qty) || 1, unit: a.unit || "本", start: todayStr(), days: num(a.days) || 14, method: "吊るし", memo: "", done: false, createdAt: Date.now() });
      else continue;
      n++;
    } catch {}
  }
  closeSheet(); toast(`${n}件を登録しました`, 3000);
}

async function pdfSave(btn) {

async function aiReport() {
  if (state.reportBusy) return;
  state.reportBusy = true; render(true);
  const st = S();
  const tools = [{ type: "web_search_20250305", name: "web_search", max_uses: 8, user_location: { type: "approximate", country: "JP", timezone: "Asia/Tokyo", ...(st.area ? { city: st.area } : {}) } }];
  let messages = [{ role: "user", content: reportPrompt() }];
  const found = new Map(), cited = new Map(); let text = "";
  try {
    for (let round = 0; round < 4; round++) {
      const j = await claudeRequest({ model: MODELS.default, max_tokens: 16000, messages, tools });
      for (const b of j.content || []) {
        if (b.type === "web_search_tool_result" && Array.isArray(b.content)) b.content.forEach(x => { if (x.url && !found.has(x.url)) found.set(x.url, x.title || x.url); });
        if (b.type === "text") { text += b.text; (b.citations || []).forEach(c => { if (c.url && !cited.has(c.url)) cited.set(c.url, c.title || c.url); }); }
      }
      if (j.stop_reason === "pause_turn") { messages = [...messages, { role: "assistant", content: j.content }]; continue; }
      break;
    }
    const r = parseJsonLoose(text);
    if (!r || typeof r !== "object" || !r.summary) throw { code: "invalid_json" };
    const src = [...(cited.size ? cited : found)].slice(0, 10).map(([url, title]) => ({ url, title }));
    const doc = { date: todayStr(), title: String(r.title || "レポート"), summary: String(r.summary), sections: (Array.isArray(r.sections) ? r.sections : []).map(s => ({ heading: String(s.heading || ""), text: String(s.text || "") })), sources: src, createdAt: Date.now() };
    await store.put("reports", todayStr(), doc);
    state.reports.sort((a, b) => a.date < b.date ? 1 : -1);
    toast("レポートができました", 3000);
    reportSheet(todayStr());
  } catch (e) { const m = aiError(e); if (m) toast(m, 5000); }
  finally { state.reportBusy = false; render(true); }
}

async function doCheckout(btn) {
  chimePrep();
  const e = curEv(), b = basket(); if (!e) return; const bs = basketSum(e, b); if (!bs.count) return;
  btn.disabled = true;
  const pay = state.payMethod || "現金", now = new Date(), time = `${pad(now.getHours())}:${pad(now.getMinutes())}`, bid = newId(); let left = bs.disc; const done = [];
  try {
    for (let i = 0; i < bs.lines.length; i++) {
      const x = bs.lines[i]; const share = i === bs.lines.length - 1 ? left : Math.round(bs.disc * x.sub / (bs.sub || 1)); left -= share;
      const id = await store.add("sales", { date: evSaleDate(e), productId: x.l.pid, name: x.l.name, qty: x.qty, price: x.unit, discount: x.off * x.qty + share, channel: "イベント", eventId: e.id, pay, time, basketId: bid, createdAt: Date.now() });
      await addStock(x.l.pid, -x.qty); done.push({ id, pid: x.l.pid, qty: x.qty });
    }
  } catch { btn.disabled = false; return; }
  state.lastBasket = { id: bid, lines: done, total: bs.total };
  state.basket = { eid: e.id, items: [], disc: "0", recv: 0 }; saveBasket();
  closeSheet(); chime(); buzz(); doneFlash(yen(bs.total), `${pay}で記録しました`);
  toastAct(`${yen(bs.total)}（${bs.count}点）を記録しました`, "取り消す", undoBasket);
  render();
}
async function undoBasket() {
  const lb = state.lastBasket; if (!lb) return;
  try { for (const x of lb.lines) { await store.remove("sales", x.id); await addStock(x.pid, x.qty); } } catch { return; }
  state.lastBasket = null; toast(`${yen(lb.total)}の会計を取り消しました`); render();
}

/* BASEのCSV */
function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ""));
}
function decodeBuf(buf) { try { return new TextDecoder("utf-8", { fatal: true }).decode(buf); } catch { return new TextDecoder("shift_jis").decode(buf); } }
function detectCols(header) {
  const h = header.map(x => String(x).trim());
  const find = (keys, avoid = []) => h.findIndex(x => keys.some(k => x.includes(k)) && !avoid.some(a => x.includes(a)));
  let price = find(["単価", "価格", "販売価格"], ["合計", "送料", "手数料", "税"]);
  if (price < 0) price = find(["金額"], ["合計", "送料", "手数料"]);
  return { date: find(["注文日時", "注文日", "購入日", "日時", "日付"]), name: find(["商品名"]), qty: find(["数量", "個数"]), price, order: find(["注文ID", "注文番号", "注文id"]) };
}
function csvSheet() {
  const html = `
  <p class="note" style="margin:0">BASEの管理画面の「注文管理」から注文のCSVをダウンロードし、ここで選んでください。取り込むのは日付・商品名・個数・値段だけで、お客さまの名前や住所は保存しません。同じ注文は2回取り込まれません。</p>
  <label class="btn primary big wide" for="cf-file" style="cursor:pointer">CSVファイルを選ぶ</label>
  <input type="file" id="cf-file" accept=".csv,text/csv" hidden>
  <div id="cf-status"></div>`;
  openSheet("BASEの注文を読み込む", html, panel => {
    $("#cf-file").addEventListener("change", async e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const st = $("#cf-status"); st.innerHTML = `<div class="card thinking">読み込んでいます…</div>`;
      try {
        const rows = parseCSV(decodeBuf(await f.arrayBuffer()).replace(/^﻿/, ""));
        if (rows.length < 2) throw new Error("empty");
        const header = rows[0]; let cols = detectCols(header);
        if ((cols.date < 0 || cols.name < 0) && sample) {
          st.innerHTML = `<div class="card thinking">列の並びをAIが確認しています…</div>`;
          try {
            const m = await sample.json(`次はネットショップの注文CSVの見出し行です。各項目が何番目（0から数える）の列かを答えてください。該当がなければ-1。
見出し: ${JSON.stringify(header.slice(0, 80))}
JSONだけで返す: {"date":注文日の列,"name":商品名の列,"qty":数量の列,"price":商品1個の価格の列,"order":注文IDの列}`, { modelTier: "quick" });
            const ok = v => Number.isInteger(v) && v >= -1 && v < header.length;
            if (m && ok(m.date) && ok(m.name)) cols = { date: m.date, name: m.name, qty: ok(m.qty) ? m.qty : -1, price: ok(m.price) ? m.price : -1, order: ok(m.order) ? m.order : -1 };
          } catch {}
        }
        if (cols.date < 0 || cols.name < 0) throw new Error("cols");
        const have = new Set(state.sales.map(s => s.importKey).filter(Boolean));
        const recs = []; let dup = 0;
        rows.slice(1).forEach((r, i) => {
          const name = String(r[cols.name] || "").trim(); if (!name) return;
          const dm = String(r[cols.date] || "").match(/(\d{4})[\/\-年.](\d{1,2})[\/\-月.](\d{1,2})/); if (!dm) return;
          const date = `${dm[1]}-${pad(dm[2])}-${pad(dm[3])}`;
          const qty = cols.qty >= 0 ? (num(r[cols.qty]) || 1) : 1;
          const price = cols.price >= 0 ? num(r[cols.price]) : 0;
          const order = cols.order >= 0 ? String(r[cols.order] || "").trim() : "";
          const key = order ? `${order}|${name}` : `${date}|${name}|${price}|${qty}`;
          if (have.has(key)) { dup++; return; }
          have.add(key);
          const p = matchProduct(name);
          recs.push({ date, name, qty, price, channel: "BASE", productId: p ? p.id : "", importKey: key, createdAt: Date.now() + i });
        });
        panel._recs = recs;
        st.innerHTML = recs.length ? `<div class="card list">
            <div><b>${recs.length}件</b>の注文が見つかりました${dup ? `（取り込み済みの${dup}件は除きます）` : ""}。</div>
            <div class="note">期間：${jpDate(recs.reduce((a, r) => r.date < a ? r.date : a, recs[0].date))} 〜 ${jpDate(recs.reduce((a, r) => r.date > a ? r.date : a, recs[0].date))}／登録済みの商品と一致：${recs.filter(r => r.productId).length}件</div>
            <label class="check"><input type="checkbox" id="cf-dec"> 一致した商品の在庫を減らす</label>
            <button class="btn primary big wide" data-act="doImport">取り込む</button></div>`
          : `<div class="card">新しく取り込む注文はありませんでした${dup ? `（${dup}件は取り込み済み）` : ""}。</div>`;
      } catch (err) {
        st.innerHTML = `<div class="card" style="color:var(--bad)">${err && err.message === "cols" ? "注文日と商品名の列が見つかりませんでした。BASEの注文CSVか確認してください。" : "ファイルを読み込めませんでした。BASEからダウンロードしたCSVか確認してください。"}</div>`;
      }
    });
  });
}
async function doImport(btn) {
  const panel = $(".panel"); const recs = panel && panel._recs; if (!recs || !recs.length) return;
  const dec = $("#cf-dec") && $("#cf-dec").checked;
  btn.disabled = true; let done = 0;
  try {
    for (const r of recs) { await store.add("sales", r); done++; if (done % 5 === 0) btn.textContent = `取り込み中… ${done}/${recs.length}`; }
    if (dec) { const by = new Map(); for (const r of recs) if (r.productId) by.set(r.productId, (by.get(r.productId) || 0) + r.qty); for (const [pid, q] of by) await addStock(pid, -q); }
    closeSheet(); toast(`${done}件の注文を取り込みました`, 3500);
  } catch { btn.disabled = false; btn.textContent = `続きを取り込む（${done}件まで完了）`; panel._recs = recs.slice(done); }
}

    try { if (await cloudBoot()) { const u = await waitAuth(); if (u) { cloudStart(u); cloudUp = true; } else { LS.del("dfn-cloud"); state.cloudLoggedOut = true; } } } catch {}
  }
  if (!cloudUp && !state.storageError) { try { await loadAll(); } catch { state.storageError = true; } }
  sample = makeSample(); state.imagesOK = true; state.imgMax = 5;
  dict = makeDict(); tts = makeTts();
  downloads = { save: ({ filename, data }) => saveFile(data instanceof Blob ? data : new Blob([data]), filename) };
  if (dict) {
    dict.onPartial(({ text }) => { const l = $("#dictLive"); if (l) l.textContent = text; });
    dict.onFinal(({ text }) => { const ta = document.getElementById(state.dictTarget); if (ta) ta.value = (ta.value ? ta.value + " " : "") + text; const l = $("#dictLive"); if (l) l.textContent = ""; });
    dict.onState(({ state: s }) => { const was = state.listening; state.listening = s === "listening"; if (was !== state.listening) render(true); });
  }
  if (tts) tts.onState(({ state: s }) => { const was = state.speaking; state.speaking = s !== "idle"; if (was !== state.speaking && visibleTabs().includes("ai") && !state.chatBusy) render(true); });
  try { if (navigator.storage && navigator.storage.persist) state.persisted = await navigator.storage.persist(); } catch {}
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  window.addEventListener("online", () => schedule()); window.addEventListener("offline", () => schedule());
  state.chatId = LS.get("dfn-room", null); state.payMethod = LS.get("dfn-pay", state.payMethod || "現金");
  await runRepeats();
  document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible" && !state.storageError) { await runRepeats(); render(true); } });
  render(true);
  if (!apiKey()) setTimeout(() => keySheet(true), 400);
}
init();
})();
</script>
